<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le mie statistiche social</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262b36;
    --text: #f2f3f5;
    --muted: #9aa1ac;
    --accent: #6ee7b7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
  .accounts-row {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .account-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    cursor: pointer;
    min-width: 180px;
    transition: border-color 0.15s;
  }
  .account-card:hover { border-color: var(--accent); }
  .account-card.active { border-color: var(--accent); }
  .account-platform {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }
  .account-name { font-size: 16px; font-weight: 600; margin: 4px 0; }
  .account-followers { font-size: 22px; font-weight: 700; }
  .account-growth { font-size: 13px; margin-top: 2px; }
  .growth-up { color: var(--accent); }
  .growth-down { color: #f87171; }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 16px 0; color: var(--muted); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .loading { color: var(--muted); padding: 20px; }
</style>
</head>
<body>

<h1>Le mie statistiche social</h1>
<p class="subtitle">Crescita, follower e performance dei contenuti nel tempo</p>

<div id="accountsRow" class="accounts-row">
  <p class="loading">Carico gli account...</p>
</div>

<div class="panel">
  <h2>Crescita follower nel tempo</h2>
  <canvas id="growthChart" height="80"></canvas>
</div>

<div class="panel">
  <h2>Video / post per performance</h2>
  <div id="videosTable"><p class="loading">Seleziona un account per vedere i contenuti.</p></div>
</div>

<script>
let accounts = [];
let currentAccountId = null;
let chart = null;

async function loadAccounts() {
  const res = await fetch('/api/accounts');
  accounts = await res.json();
  const row = document.getElementById('accountsRow');

  if (!accounts.length) {
    row.innerHTML = '<p class="empty">Nessun account collegato ancora, o nessuno snapshot salvato. Riprova dopo il primo snapshot.</p>';
    return;
  }

  row.innerHTML = accounts.map(acc => {
    const growth = acc.followers_start != null ? acc.followers - acc.followers_start : 0;
    const growthClass = growth >= 0 ? 'growth-up' : 'growth-down';
    const growthSign = growth >= 0 ? '+' : '';
    return `
      <div class="account-card" data-id="${acc.id}" onclick="selectAccount(${acc.id})">
        <div class="account-platform">${acc.platform}</div>
        <div class="account-name">${acc.display_name || '(senza nome)'}</div>
        <div class="account-followers">${formatNumber(acc.followers)}</div>
        <div class="account-growth ${growthClass}">${growthSign}${formatNumber(growth)} follower</div>
      </div>
    `;
  }).join('');

  selectAccount(accounts[0].id);
}

function formatNumber(n) {
  if (n == null) return '—';
  return new Intl.NumberFormat('it-IT').format(n);
}

async function selectAccount(id) {
  currentAccountId = id;
  document.querySelectorAll('.account-card').forEach(el => {
    el.classList.toggle('active', Number(el.dataset.id) === id);
  });
  await Promise.all([loadHistory(id), loadVideos(id)]);
}

async function loadHistory(id) {
  const res = await fetch(`/api/accounts/${id}/history`);
  const data = await res.json();

  const labels = data.map(d => new Date(d.snapshot_date).toLocaleDateString('it-IT'));
  const followers = data.map(d => d.followers);

  if (chart) chart.destroy();
  const ctx = document.getElementById('growthChart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Follower',
        data: followers,
        borderColor: '#6ee7b7',
        backgroundColor: 'rgba(110, 231, 183, 0.1)',
        fill: true,
        tension: 0.3,
      }],
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#9aa1ac' }, grid: { color: '#262b36' } },
        y: { ticks: { color: '#9aa1ac' }, grid: { color: '#262b36' } },
      },
    },
  });
}

async function loadVideos(id) {
  const res = await fetch(`/api/accounts/${id}/videos`);
  const videos = await res.json();
  const container = document.getElementById('videosTable');

  if (!videos.length) {
    container.innerHTML = '<p class="empty">Nessun contenuto salvato ancora per questo account.</p>';
    return;
  }

  container.innerHTML = `
    <table>
      <thead>
        <tr><th>Titolo</th><th>Pubblicato</th><th style="text-align:right">Views</th><th style="text-align:right">Like</th><th style="text-align:right">Commenti</th></tr>
      </thead>
      <tbody>
        ${videos.map(v => `
          <tr>
            <td>${escapeHtml(v.title || '(senza titolo)')}</td>
            <td>${v.published_at ? new Date(v.published_at).toLocaleDateString('it-IT') : '—'}</td>
            <td class="num">${formatNumber(v.views)}</td>
            <td class="num">${formatNumber(v.likes)}</td>
            <td class="num">${formatNumber(v.comments)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadAccounts();
</script>

</body>
</html>
